[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "summarizer"
# Single source of truth: the version comes from summarizer.__version__.
dynamic = ["version"]
description = "A local-first, Unix-native terminal summarizer for local LLM servers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "summarizer contributors" }]
keywords = ["summarize", "llm", "openai-compatible", "local-first", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]
# Runtime dependencies are deliberately zero. The HTTP client uses the
# standard library, config parsing uses tomllib, and heavier machinery
# (PDF, OCR) is isolated behind optional extras.
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
ocr = ["pypdf>=4.0", "pytesseract>=0.3.10", "pdf2image>=1.16"]
test = ["pytest>=8.0", "pypdf>=4.0"]

[project.scripts]
summarize = "summarizer.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "summarizer.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
summarizer = ["profiles/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
